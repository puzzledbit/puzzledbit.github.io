<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- GitHub Pages serves this file for any missing path, including nested ones; resolve assets from the site root -->
    <base href="/">
    <title>Page not found — Vadim Smal</title>
    <meta name="description" content="Page not found">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="stylesheets/normalize.css">
    <link rel="stylesheet" href="stylesheets/custom.css">
  </head>
  <body data-page="404">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="container" tabindex="-1">
      <section class="page-head not-found">
        <p class="not-found-code hero-in" style="--i:0" aria-hidden="true">404</p>
        <h1 class="page-title hero-in" style="--i:1">Page not found</h1>
        <p class="page-lead hero-in" style="--i:2">The page you're looking for doesn't exist or has moved.</p>
        <div class="page-actions hero-in" style="--i:3">
          <a class="btn btn-primary" href="index.html">Back to home</a>
          <a class="btn btn-ghost" href="resume.html">View résumé</a>
        </div>
      </section>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <script src="scripts/utils.js"></script>
    <script src="scripts/animations.js"></script>
    <script src="scripts/layout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        initLayout('404').catch(error => console.error('Error initializing page:', error));
        initAnimations();
      });
    </script>
  </body>
</html>
